<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rock Paper Scissors</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>
:root{
  --bg1:#F4F8FF;--bg2:#FBF3FF;color-scheme:light;--card:#FFFFFF;--soft:#F1F3FC;--ink:#1B2140;--muted:#6B7299;--line:#DDE2F5;
  --rock:#F59E0B;--paper:#2F9BFF;--scissors:#EF476F;--win:#12A072;--lose:#E5484D;--draw:#C98A00;--shadow:rgba(50,50,140,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:var(--bg1);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:100%;max-width:480px;margin:18px 14px;background:var(--card);border-radius:28px;padding:22px 18px 20px;box-shadow:0 24px 60px -24px var(--shadow);display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.chip{background:var(--soft);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700;color:var(--muted);white-space:nowrap}
.score{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--soft);border-radius:18px;padding:6px}
.score div{text-align:center;padding:6px 4px}
.score div+div{border-left:1.5px solid var(--line)}
.score b{display:block;font-size:1.8rem;font-weight:800;line-height:1.15}
.score span{font-size:.8rem;color:var(--muted);font-weight:600}
#you b{color:var(--paper)}#cpu b{color:var(--scissors)}
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:20px 8px 14px;border-radius:22px;background:var(--soft)}
.disc{width:clamp(92px,28vw,120px);aspect-ratio:1;border-radius:50%;background:var(--card);display:grid;place-items:center;margin:0 auto;border:4px solid transparent;box-shadow:0 10px 24px -12px var(--shadow);transition:box-shadow .25s,border-color .25s,opacity .25s}
.disc.won{border-color:var(--win);box-shadow:0 0 0 7px rgba(18,160,114,.22)}
.disc.draw{border-color:var(--draw)}
.disc.lost{opacity:.5}
.hand{font-size:clamp(2.8rem,14vw,3.8rem);line-height:1;display:inline-block}
#cpuHand{transform:scaleX(-1)}
.who{text-align:center;margin-top:10px;font-size:.85rem;font-weight:700;color:var(--muted)}
.vs{font-weight:800;font-size:.9rem;color:var(--muted);background:var(--card);border-radius:999px;padding:6px 9px}
.shake #youHand{animation:shakeY .5s ease-in-out 2}
.shake #cpuHand{animation:shakeC .5s ease-in-out 2}
@keyframes shakeY{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-12px) rotate(-8deg)}75%{transform:translateY(6px) rotate(8deg)}}
@keyframes shakeC{0%,100%{transform:scaleX(-1) translateY(0) rotate(0)}25%{transform:scaleX(-1) translateY(-12px) rotate(-8deg)}75%{transform:scaleX(-1) translateY(6px) rotate(8deg)}}
.result{text-align:center;min-height:3.4em}
.result strong{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.result span{color:var(--muted);font-weight:500;font-size:.95rem}
.result.win strong{color:var(--win)}.result.lose strong{color:var(--lose)}.result.draw strong{color:var(--draw)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.picks button{--c:var(--paper);font:inherit;color:var(--ink);background:var(--soft);border:0;border-bottom:5px solid var(--c);border-radius:20px;padding:14px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s,background .12s}
.picks button:hover:not(:disabled){transform:translateY(-3px);background:var(--line)}
.picks button:active:not(:disabled){transform:translateY(1px)}
.picks button:disabled{opacity:.5;cursor:wait}
.picks .e{font-size:2.4rem;line-height:1.1}
.picks .n{font-weight:700;font-size:1rem}
.picks kbd{font:inherit;font-size:.75rem;font-weight:700;color:var(--muted)}
button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.reset{align-self:center;font:inherit;font-weight:700;font-size:.9rem;color:var(--muted);background:none;border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
.reset:hover{background:var(--soft);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.shake #youHand,.shake #cpuHand{animation:none}}
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <h1>Rock Paper Scissors</h1>
    <div class="chip" id="streak">Streak 0</div>
  </div>

  <section class="score" aria-label="Scoreboard">
    <div id="you"><b id="sYou">0</b><span>You</span></div>
    <div><b id="sDraw">0</b><span>Draws</span></div>
    <div id="cpu"><b id="sCpu">0</b><span>Computer</span></div>
  </section>

  <section class="arena" id="arena">
    <div><div class="disc" id="youDisc"><span class="hand" id="youHand">❔</span></div><div class="who">You</div></div>
    <div class="vs">VS</div>
    <div><div class="disc" id="cpuDisc"><span class="hand" id="cpuHand">❔</span></div><div class="who">Computer</div></div>
  </section>

  <div class="result" id="result" aria-live="polite"><strong>Your move</strong><span>Tap a hand, or press R, P or S.</span></div>

  <section class="picks" aria-label="Choose your hand">
    <button data-c="rock" style="--c:var(--rock)"><span class="e">✊</span><span class="n">Rock</span><kbd>R</kbd></button>
    <button data-c="paper" style="--c:var(--paper)"><span class="e">✋</span><span class="n">Paper</span><kbd>P</kbd></button>
    <button data-c="scissors" style="--c:var(--scissors)"><span class="e">✌️</span><span class="n">Scissors</span><kbd>S</kbd></button>
  </section>

  <button class="reset" id="reset">Reset score</button>
</main>

<script>
(function(){
  var E={rock:"✊",paper:"✋",scissors:"✌️"};
  var beats={rock:"scissors",paper:"rock",scissors:"paper"};
  var verb={rock:"Rock smashes scissors",paper:"Paper covers rock",scissors:"Scissors cut paper"};
  var s={you:0,cpu:0,draw:0,streak:0},busy=false;
  var $=function(id){return document.getElementById(id)};
  var btns=document.querySelectorAll(".picks button");
  var START="<strong>Your move</strong><span>Tap a hand, or press R, P or S.</span>";

  function render(){
    $("sYou").textContent=s.you;$("sCpu").textContent=s.cpu;$("sDraw").textContent=s.draw;
    $("streak").textContent="Streak "+s.streak;
  }
  function discs(y,c){$("youDisc").className="disc "+y;$("cpuDisc").className="disc "+c}
  function setBusy(b){busy=b;btns.forEach(function(x){x.disabled=b})}

  function play(pick){
    if(busy)return;
    setBusy(true);
    var keys=Object.keys(E),cpu=keys[Math.floor(Math.random()*3)],res=$("result");
    res.className="result";
    res.innerHTML="<strong>Rock, paper, scissors…</strong><span>&nbsp;</span>";
    discs("","");
    $("youHand").textContent="✊";$("cpuHand").textContent="✊";
    var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    $("arena").classList.add("shake");
    setTimeout(function(){
      $("arena").classList.remove("shake");
      $("youHand").textContent=E[pick];$("cpuHand").textContent=E[cpu];
      var cls,title,line;
      if(pick===cpu){s.draw++;s.streak=0;cls="draw";title="It's a draw";line="You both picked "+pick+".";discs("draw","draw");}
      else if(beats[pick]===cpu){s.you++;s.streak++;cls="win";title="You win";line=verb[pick]+".";discs("won","lost");}
      else{s.cpu++;s.streak=0;cls="lose";title="Computer wins";line=verb[cpu]+".";discs("lost","won");}
      res.className="result "+cls;
      res.innerHTML="<strong>"+title+"</strong><span>"+line+"</span>";
      render();setBusy(false);
    },reduce?100:1000);
  }

  btns.forEach(function(b){b.addEventListener("click",function(){play(b.dataset.c)})});
  document.addEventListener("keydown",function(e){
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    var k={r:"rock",p:"paper",s:"scissors"}[e.key.toLowerCase()];
    if(k)play(k);
  });
  $("reset").addEventListener("click",function(){
    s={you:0,cpu:0,draw:0,streak:0};render();discs("","");
    $("youHand").textContent="❔";$("cpuHand").textContent="❔";
    $("result").className="result";$("result").innerHTML=START;
  });
})();
</script>
</body>
</html>
